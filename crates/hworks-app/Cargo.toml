[package]
name = "hworks-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "hcad"
path = "src/main.rs"

[dependencies]
bevy = { workspace = true }
bevy_egui = "0.39"
ron = "0.8"
rfd = "0.15"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "bmp", "gif"] }
base64 = "=0.22.1"
ttf-parser = "0.25"
ab_glyph = "0.2"
hworks-document = { path = "../hworks-document" }
hworks-sketch = { path = "../hworks-sketch" }
hworks-geometry = { path = "../hworks-geometry" }
